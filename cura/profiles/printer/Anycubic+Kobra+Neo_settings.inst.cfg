[general]
version = 4
name = Anycubic Kobra Neo_settings
definition = custom

[metadata]
type = definition_changes
setting_version = 26

[values]
machine_max_feedrate_e = 50
machine_max_feedrate_z = 4
machine_max_feedrate_y = 300
machine_max_feedrate_x = 300
machine_max_jerk_e = 5
machine_max_jerk_z = 5
machine_max_jerk_xy = 8
machine_max_acceleration_e = 500
machine_max_acceleration_z = 100
machine_max_acceleration_y = 1000
machine_max_acceleration_x = 1000
machine_acceleration = 500
extruders_enabled_count = 1
machine_depth = 220.0
machine_end_gcode = ;Clean end - Kobra Neo
	G91 ; relative moves
	G1 E-1 F1800 ; retract 1 mm
	G1 Z5 F600 ; lift 5 mm
	G90 ; absolute moves
	M104 S0 ; nozzle off
	M140 S0 ; bed off
	M106 S0 ; fan off
	G1 X0 Y220 F5000 ; present the part
	M84 ; motors off
machine_heated_bed = True
machine_height = 250.0
machine_start_gcode = ;Clean start - Kobra Neo with KNE firmware (Nov 2026)
	;The firmware already carries the extruder steps and PID: they are not set here
	;M1100 does: home, heat bed, (Full mode) soak W minutes and measure the hot mesh, heat nozzle
	;In Express mode it heats bed and nozzle together and uses the saved mesh
	M1100 S{material_bed_temperature_layer_0} T{material_print_temperature_layer_0} W7 ; bed temp, nozzle temp, soak minutes
	G92 E0 ; reset extruder
	G1 Z5 F600 ; lift before starting
machine_width = 220.0
